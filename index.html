<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Favicon / Browser Tab Logo -->
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  
  <!-- Primary Meta Tags -->
  <title>RIVO - Wear Your Identity</title>
  <meta name="title" content="RIVO - Wear Your Identity">
  <meta name="description" content="Premium streetwear brand. Wear Your Identity. Shop the latest drops, custom designs, and limited editions.">
  <meta name="keywords" content="streetwear, t-shirts, custom clothing, fashion, RIVO, urban wear">
  <meta name="author" content="RIVO">
  <meta name="theme-color" content="#0e0e10">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rivo.com/">
  <meta property="og:title" content="RIVO - Wear Your Identity">
  <meta property="og:description" content="Premium streetwear brand. Wear Your Identity.">
  <meta property="og:image" content="/logo.png">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://rivo.com/">
  <meta property="twitter:title" content="RIVO - Wear Your Identity">
  <meta property="twitter:description" content="Premium streetwear brand. Wear Your Identity.">
  <meta property="twitter:image" content="/logo.png">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#0e0e10",
            "surface-container-low": "#131315",
            "surface-container": "#19191c",
            "surface-container-high": "#1f1f22",
            "surface-container-highest": "#262528",
            "surface-variant": "#262528",
            "surface-bright": "#2c2c2f",
            "primary": "#8ff5ff",
            "primary-fixed": "#00eefc",
            "primary-container": "#00eefc",
            "primary-dim": "#00deec",
            "secondary": "#ff6b98",
            "tertiary": "#bcff5f",
            "error": "#ff716c",
            "error-dim": "#d7383b",
            "on-surface": "#f9f5f8",
            "on-surface-variant": "#adaaad",
            "on-primary": "#005d63",
            "on-secondary": "#47001d",
            "on-tertiary": "#3d6100",
            "outline": "#767577",
            "outline-variant": "#48474a"
          },
          borderRadius: {
            DEFAULT: "1rem",
            lg: "2rem",
            xl: "3rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      vertical-align: middle;
    }
    .glass-effect {
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .glass-panel {
      background: rgba(38, 37, 40, 0.6);
      backdrop-filter: blur(24px);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0e0e10;
      color: #f9f5f8;
    }
    h1, h2, h3, h4, h5, h6, .font-headline {
      font-family: 'Space Grotesk', sans-serif;
    }
    
    /* Custom loading animation */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0e0e10;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .logo-pulse {
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
  </style>
</head>
<body class="bg-surface text-on-surface">
  <!-- Loading Screen with Logo -->
  <div id="loading-screen">
    <div class="text-center logo-pulse">
      <img src="/logo.png" alt="RIVO" class="w-24 h-24 md:w-32 md:h-32 mx-auto mb-4" onerror="this.style.display='none'">
      <h1 class="font-headline text-4xl md:text-6xl font-black italic tracking-tighter bg-gradient-to-r from-primary to-primary-fixed bg-clip-text text-transparent">
        RIVO
      </h1>
      <p class="text-on-surface-variant text-sm mt-2 tracking-widest">WEAR YOUR IDENTITY</p>
    </div>
  </div>
  
  <div id="root"></div>
  
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- Hide loading screen after app loads -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.classList.add('fade-out');
          setTimeout(function() {
            loadingScreen.style.display = 'none';
          }, 500);
        }
      }, 1000);
    });
  </script>
</body>
</html>
